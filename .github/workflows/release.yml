name: Release

# Tag a release from your laptop with `mise run release -- v1.2.3`. This builds the UI, then
# multi-arch (linux/arm64 for the Pi, linux/amd64 for laptops/CI) images for backend and
# asterisk, pushes them to GHCR as :v1.2.3 and :stable, and publishes a GitHub release.
# The Pi's tincan-update.timer notices the new release within 10 minutes.
#
# Build time: the Asterisk image compiles from source. Under QEMU emulation on a hosted
# ubuntu-latest runner the arm64 half takes 40-60 minutes. The registry cache below makes
# rebuilds of an unchanged Dockerfile near-instant, so only Asterisk version bumps are slow.
# When that hurts, either (a) use GitHub's native arm64 runners (`runs-on: ubuntu-24.04-arm`,
# free for public repos) and build each arch natively with a manifest merge step, or (b) register
# the Pi itself as a self-hosted runner with the `arm64` label and build there. Both are
# follow-ups; the single-job cross-build below is the simplest thing that works.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  packages: write      # push to ghcr.io

env:
  REGISTRY: ghcr.io
  # Image names are ghcr.io/<owner>/tincan-{backend,asterisk}, matching deploy/compose.yaml.
  OWNER: ${{ github.repository_owner }}

jobs:
  ui:
    name: build ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  images:
    name: ${{ matrix.image }} image
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tincan-backend
            context: .
            dockerfile: backend/Dockerfile
          - image: tincan-asterisk
            context: asterisk
            dockerfile: asterisk/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.image == 'tincan-backend'
        with:
          name: ui-dist
          path: ui/dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=stable
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TINCAN_VERSION=${{ github.ref_name }}
            UI_DIST=local
          # Registry cache: one cache image per app, shared across tags, mode=max keeps every
          # layer (the Asterisk builder stage especially). This is what makes a backend-only
          # release not rebuild Asterisk.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache,mode=max
          provenance: false

  release:
    name: github release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release notes
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "Images:"
            echo '```'
            echo "ghcr.io/${OWNER}/tincan-backend:${GITHUB_REF_NAME}"
            echo "ghcr.io/${OWNER}/tincan-asterisk:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "Pis on the \`stable\` channel pick this up within 10 minutes. Pin with"
            echo "\`sudo /opt/tincan/update.sh --version ${GITHUB_REF_NAME}\`; undo with \`--rollback\`."
            echo
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              git log --no-merges --pretty='- %s (%h)' "$prev..${GITHUB_REF_NAME}"
            else
              echo "## Changes"
              git log --no-merges --pretty='- %s (%h)' -n 50
            fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
