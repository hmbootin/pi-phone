; Tin Can: Asterisk 20 paths. /data is the volume shared with the backend container.
; ARI stored recordings always go to <astspooldir>/recording, so bridge/channel recordings land at
; /data/asterisk/recording/<yyyy>/<mm>/<name>.wav where the backend expects them (backend/README.md).
[directories](!)
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /data/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
defaultlanguage = en
documentation_language = en_US
transmit_silence = yes
hideconnect = yes
