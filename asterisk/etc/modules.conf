; Tin Can: load only what the ARI-driven dialplan needs.
[modules]
autoload = no

; core / dialplan
load => pbx_config.so
load => app_stack.so
load => app_playback.so
load => app_mixmonitor.so
load => func_callerid.so
load => func_channel.so
load => func_cdr.so
load => func_logic.so
load => func_strings.so
load => func_timeout.so
load => func_pjsip_endpoint.so
load => func_pjsip_contact.so

; SIP (chan_pjsip) and media
load => res_pjproject.so
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_endpoint_identifier_anonymous.so
load => res_pjsip_registrar.so
load => res_pjsip_outbound_registration.so
load => res_pjsip_outbound_authenticator_digest.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_dtmf_info.so
load => res_pjsip_caller_id.so
load => res_pjsip_nat.so
load => res_pjsip_rfc3326.so
load => res_pjsip_logger.so
load => res_pjsip_header_funcs.so
load => res_pjsip_refer.so
; chan_pjsip and res_pjsip_refer `.requires` res_pjsip_pubsub (SUBSCRIBE/NOTIFY plumbing) even
; though we never subscribe to anything; without it they decline to load.
load => res_pjsip_pubsub.so
load => chan_pjsip.so
load => res_rtp_asterisk.so
load => res_timing_timerfd.so
load => res_musiconhold.so

; codecs and formats (baresip and trunks speak ulaw/alaw; gsm is cheap on a Pi)
load => codec_ulaw.so
load => codec_alaw.so
load => codec_gsm.so
load => codec_resample.so
load => format_wav.so
load => format_wav_gsm.so
load => format_pcm.so
load => format_gsm.so
load => format_sln.so

; HTTP + ARI + Stasis (the backend drives everything through these)
load => res_http_websocket.so
; res_ari `.requires` res_websocket_client since 20.x (outbound ARI websockets); it is tiny and
; res_ari declines to load without it.
load => res_websocket_client.so
load => res_stasis.so
load => res_stasis_answer.so
load => res_stasis_playback.so
load => res_stasis_recording.so
load => res_stasis_snoop.so
load => res_stasis_device_state.so
load => res_ari.so
load => res_ari_model.so
load => res_ari_applications.so
load => res_ari_asterisk.so
load => res_ari_bridges.so
load => res_ari_channels.so
load => res_ari_endpoints.so
load => res_ari_events.so
load => res_ari_playbacks.so
load => res_ari_recordings.so
load => res_ari_sounds.so
load => res_ari_device_states.so
load => app_stasis.so

; bridging
load => bridge_simple.so
load => bridge_softmix.so
load => bridge_holding.so
load => bridge_native_rtp.so

; explicitly never
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_dahdi.so
noload => chan_console.so
noload => chan_alsa.so
noload => chan_oss.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_motif.so
noload => res_phoneprov.so
noload => res_calendar.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cel_custom.so
noload => pbx_ael.so
noload => pbx_lua.so
noload => app_voicemail.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
noload => res_config_odbc.so
noload => res_odbc.so
noload => res_smdi.so
noload => res_snmp.so
noload => res_ael_share.so
noload => res_adsi.so
noload => res_monitor.so
