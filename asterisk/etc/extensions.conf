; Tin Can dialplan. Deliberately dumb: every call goes straight into the "tincan" Stasis app and the
; backend (ARI) decides what happens. If the backend is down, Stasis() returns immediately and the
; caller hears a short message instead of silence or an open line.

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
TINCAN_APP = tincan

; ---- the phone (baresip): a digit was dialed ----------------------------------------------------------------
[from-phone]
exten => _X,1,NoOp(Tin Can: phone dialed ${EXTEN})
 same => n,Stasis(${TINCAN_APP},dial,${EXTEN})
 same => n,Goto(backend-down,s,1)

exten => _X.,1,NoOp(Tin Can: phone dialed ${EXTEN})
 same => n,Stasis(${TINCAN_APP},dial,${EXTEN})
 same => n,Goto(backend-down,s,1)

; Memory keys M1..M9 and SOS. baresip dials them as sip:m1@asterisk etc. (see
; backend/tincan/hardware); the backend maps them to contacts by their memory_key field.
exten => _m[1-9],1,NoOp(Tin Can: phone pressed memory key ${EXTEN})
 same => n,Stasis(${TINCAN_APP},dial,${EXTEN})
 same => n,Goto(backend-down,s,1)

exten => sos,1,NoOp(Tin Can: phone pressed SOS)
 same => n,Stasis(${TINCAN_APP},dial,sos)
 same => n,Goto(backend-down,s,1)

; Nothing dialed / special keys: play a tone and hang up rather than leave an open line.
exten => s,1,Goto(backend-down,s,1)
exten => i,1,Goto(backend-down,s,1)
exten => t,1,Hangup()
exten => h,1,NoOp(Tin Can: phone leg hung up)

; ---- the trunk: somebody is calling our number --------------------------------------------------
[from-trunk]
exten => _X.,1,NoOp(Tin Can: inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Stasis(${TINCAN_APP},inbound)
 same => n,Hangup()

exten => s,1,Goto(from-trunk,unknown,1)
exten => unknown,1,NoOp(Tin Can: inbound from ${CALLERID(num)} with no DID)
 same => n,Stasis(${TINCAN_APP},inbound)
 same => n,Hangup()
exten => i,1,Hangup()
exten => t,1,Hangup()
exten => h,1,NoOp(Tin Can: trunk leg hung up)

; ---- safe failure: backend not connected to ARI --------------------------------------------------
[backend-down]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Playback(beep)
 same => n,Wait(1)
 same => n,Hangup()
