; Minimal pjsip.conf for phone/compose.test.stock.yaml (a stock Asterisk 20 image).
; The [phone] sections are a copy of asterisk/etc/pjsip.conf.tmpl with the password fixed to the
; test value; keep them in sync when the endpoint definition changes. No trunk.

[global]
type = global
user_agent = TinCan-test
endpoint_identifier_order = username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[phone]
type = endpoint
context = from-phone
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
auth = phone-auth
aors = phone
callerid = Tin Can <100>
language = en
send_pai = no
trust_id_inbound = no
device_state_busy_at = 1

[phone-auth]
type = auth
auth_type = userpass
username = phone
password = phone-test-password

[phone]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
