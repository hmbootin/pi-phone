; Dialplan for the stock-image registration test. The phone's calls land here; there is no
; Stasis app in this rig, so a dialled digit just gets an echo test. Registration is the point.
[general]
static = yes
writeprotect = no

[from-phone]
exten => _X!,1,NoOp(phone dialled ${EXTEN})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
